# Certificate provisioning is described in Docu/DEPLOYMENT.md.
server {
    listen 443 ssl;
    server_name privatebar.local;
    root /srv/privatebar/current/public;
    index index.php;
    ssl_certificate /etc/privatebar/tls/fullchain.pem;
    ssl_certificate_key /etc/privatebar/tls/privkey.pem;
    client_max_body_size 21m;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
